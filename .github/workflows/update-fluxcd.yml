name: Update FluxCD

on:
  push:
    branches: ["main"]
    paths:
      - "rust-container/**"
      - "java-container/**"
      - ".github/workflows/rust-container-docker-publish.yml"
      - ".github/workflows/java-container-docker-publish.yml"
      - ".github/workflows/update-fluxcd.yml"

jobs:
  update-fluxcd:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine which containers changed
        id: changes
        run: |
          # Check for changes in the current push
          # We check the difference between the before and after commit of the push event
          
          RUST_CHANGES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -E '^(rust-container/|.github/workflows/rust-container-docker-publish.yml)' || true)
          JAVA_CHANGES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -E '^(java-container/|.github/workflows/java-container-docker-publish.yml)' || true)
          
          if [ -n "$RUST_CHANGES" ]; then
            echo "rust=true" >> $GITHUB_OUTPUT
            echo "Rust container changed."
          else
            echo "rust=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "$JAVA_CHANGES" ]; then
            echo "java=true" >> $GITHUB_OUTPUT
            echo "Java container changed."
          else
            echo "java=false" >> $GITHUB_OUTPUT
          fi

      - name: Wait for Docker Workflows
        uses: actions/github-script@v7
        with:
          script: |
            const rustChanged = "${{ steps.changes.outputs.rust }}" === "true";
            const javaChanged = "${{ steps.changes.outputs.java }}" === "true";
            
            const workflowFilenames = [];
            if (rustChanged) workflowFilenames.push('rust-container-docker-publish.yml');
            if (javaChanged) workflowFilenames.push('java-container-docker-publish.yml');
            
            if (workflowFilenames.length === 0) {
              console.log("No container changes detected. Skipping wait.");
              return;
            }

            const maxRetries = 60; // Wait up to 30 minutes (30s interval)
            const intervalSeconds = 30;
            const commitSha = context.sha;

            console.log(`Waiting for workflows ${workflowFilenames.join(', ')} on commit ${commitSha}...`);

            const completedWorkflows = new Set();

            for (let i = 0; i < maxRetries; i++) {
              for (const workflowId of workflowFilenames) {
                if (completedWorkflows.has(workflowId)) continue;

                try {
                  const runs = await github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: workflowId,
                    head_sha: commitSha,
                  });

                  if (runs.data.total_count === 0) {
                    console.log(`Workflow run ${workflowId} not found yet. Waiting...`);
                  } else {
                    const run = runs.data.workflow_runs[0];
                    console.log(`Found workflow run: ${workflowId} (ID: ${run.id}, Status: ${run.status}, Conclusion: ${run.conclusion})`);

                    if (run.status === 'completed') {
                      if (run.conclusion === 'success') {
                        console.log(`CI ${workflowId} completed successfully.`);
                        completedWorkflows.add(workflowId);
                      } else {
                        core.setFailed(`CI workflow ${workflowId} failed with conclusion: ${run.conclusion}`);
                        return;
                      }
                    }
                  }
                } catch (error) {
                  console.log(`Error checking workflow status for ${workflowId}: ${error.message}. Retrying...`);
                }
              }

              if (completedWorkflows.size === workflowFilenames.length) {
                console.log('All required CI workflows completed successfully.');
                return;
              }
              await new Promise(r => setTimeout(r, intervalSeconds * 1000));
            }
            core.setFailed('Timeout waiting for required CI workflows to complete.');

      - name: Update fluxcd-dev tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          RUST_SHA=$(git log -1 --format=%H -- rust-container/ .github/workflows/rust-container-docker-publish.yml)
          JAVA_SHA=$(git log -1 --format=%H -- java-container/ .github/workflows/java-container-docker-publish.yml)
          
          # Logic: If both changed, Rust takes precedence for the single tag update.
          # Otherwise use the one that changed.
          
          if [ "${{ steps.changes.outputs.rust }}" == "true" ]; then
            NEW_TAG="rust-sha-$RUST_SHA"
          elif [ "${{ steps.changes.outputs.java }}" == "true" ]; then
            NEW_TAG="java-sha-$JAVA_SHA"
          else
            echo "No container changes detected. Exiting."
            exit 0
          fi
          
          echo "Determined new tag: $NEW_TAG"
          
          # Update the tag in the HelmRelease manifest
          yq e "(. | select(.kind == \"HelmRelease\" and .metadata.name == \"push-cache-backend\") | .spec.values.image.tag) = \"$NEW_TAG\"" -i fluxcd-dev/app-push-cache.yaml
          
          git add fluxcd-dev/app-push-cache.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit for fluxcd-dev tags."
          else
            BRANCH_NAME="update-fluxcd-${GITHUB_SHA}"
            git checkout -b $BRANCH_NAME
            git commit -m "chore: update fluxcd-dev tag to $NEW_TAG"
            
            git push origin $BRANCH_NAME
            
            gh pr create --title "chore: update fluxcd-dev tag to $NEW_TAG" \
              --body "Automated PR to update FluxCD tag for push-cache-backend based on new image build. Implementation: ${NEW_TAG%%-*}" \
              --base main --head $BRANCH_NAME
            
            gh pr merge $BRANCH_NAME --auto --rebase
          fi
